# Local development against Neon. Values come from backend/.env (gitignored).
spring.config.import=optional:file:.env[.properties]

# App traffic goes through Neon's pooled host (PgBouncer, transaction mode).
# prepareThreshold=0 must be on DB_URL: PgBouncer cannot keep server-side prepared statements.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Neon scales to zero; the first connection after idle can take a few seconds.
# Hikari binds to a raw long (milliseconds), not a Duration, so "30s" fails to bind.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# Migrations use the direct (unpooled) host: DDL and Flyway's locks need a real session.
spring.flyway.url=${DB_MIGRATION_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}

management.endpoint.health.show-details=always

# JWT signing key (one-line base64 PKCS#8) and its id. See .env.example for how to generate.
spendly.jwt.private-key=${JWT_PRIVATE_KEY}
spendly.jwt.key-id=${JWT_KEY_ID}
