# Base settings: safe in every environment, no secrets.
# Environment-specific wiring lives in application-<profile>.properties.
spring.application.name=spendly

# Flyway owns the schema. Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading in views/controllers: services fetch what they need inside the transaction.
spring.jpa.open-in-view=false
# Write and read timestamps in UTC regardless of the server's zone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Postgres error messages include a "Detail" line with the failing row's values
# (email, password hash...). Hibernate logs that text at WARN and it ends up in stack
# traces. Keep the detail out of exception messages; the constraint name still comes
# through separately, which is all our code uses.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.error.include-stacktrace=never
server.error.include-message=never

# Print the request id (set by RequestIdFilter in the MDC) after the level on every line.
# %X{requestId:-} prints nothing when there is no request (startup, scheduled jobs).
logging.pattern.level=%5p [%X{requestId:-}]

# JWT access tokens (step 005). The signing key is environment-specific: see application-dev.properties.
spendly.jwt.issuer=spendly
spendly.jwt.access-token-ttl=15m

# OpenAPI docs (step 006). Off by default so a prod build never publishes the API map.
# application-dev.properties turns them on. SecurityConfig reads the same switch.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Show endpoints in code order and keep "Authorize" filled in across page reloads.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.default-produces-media-type=application/json

# Refresh tokens (step 007). Each use returns a new one; an unused one dies after this.
spendly.refresh-token.ttl=30d
